<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
    :root{
      --bg:oklch(0.985 0.002 255); --surface:#fff;
      --surface-2:oklch(0.972 0.003 255); --surface-3:oklch(0.955 0.004 255);
      --border:oklch(0.918 0.004 255); --border-strong:oklch(0.86 0.006 255);
      --text:oklch(0.24 0.012 262); --text-2:oklch(0.44 0.012 262);
      --text-muted:oklch(0.58 0.01 262); --text-faint:oklch(0.72 0.008 262);
      --accent:oklch(0.63 0.108 185); --accent-hover:oklch(0.57 0.11 185);
      --accent-subtle:oklch(0.965 0.028 185); --accent-subtle-bd:oklch(0.90 0.045 185);
      --accent-text:oklch(0.44 0.09 185);
      --info:oklch(0.60 0.10 240); --info-bg:oklch(0.962 0.03 240);
      --font:'Geist',-apple-system,'Segoe UI',system-ui,sans-serif;
      --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em;}
    p{margin:0;}
    .mono{font-family:var(--mono);}
    .app{width:1440px;height:900px;display:flex;overflow:hidden;background:var(--bg);}
    .sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;}
    .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;font-size:15px;font-weight:600;letter-spacing:-0.02em;}
    .brand i{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;}
    .nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--text-2);font-size:13px;font-weight:450;cursor:pointer;}
    .nav-item svg{width:16px;height:16px;opacity:.75;}
    .nav-item.active{background:var(--accent-subtle);color:var(--accent-text);font-weight:550;}
    .nav-item.active svg{opacity:1;}
    .nav-sec{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:16px 10px 6px;}
    .avatar{width:28px;height:28px;border-radius:999px;background:var(--accent-subtle);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1px solid var(--accent-subtle-bd);}
    .main{flex:1;display:flex;flex-direction:column;min-width:0;}
    .topbar{height:56px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--surface);}
    .eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);}
    .h-page{font-size:19px;font-weight:600;letter-spacing:-0.018em;}
    .btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;border:1px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;}
    .btn svg{width:14px;height:14px;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);}
    .spec{font-family:var(--mono);font-size:11px;color:var(--text-muted);}
    .callout{position:absolute;font-family:var(--mono);font-size:10.5px;color:var(--accent-text);background:var(--accent-subtle);border:1px solid var(--accent-subtle-bd);border-radius:6px;padding:3px 7px;}
  </style>
</helmet>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><i>C</i>Copilot</div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Dashboard</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Resume</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Jobs</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L18.7 9l-4.9 1.8L12 15.7 10.2 10.8 5.3 9l4.9-1.8z"/></svg>Tailoring</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Approvals</div>
    <div class="nav-sec">Growth</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Skill roadmap</div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 17v-7"/></svg>LinkedIn</div>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid var(--border);">
      <div class="avatar">AM</div>
      <div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:550;">Aarav Mehta</div><div style="font-size:11px;color:var(--text-muted);">Free plan</div></div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8 2 2 0 1 1-2.8 2.8 1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5 2 2 0 0 1-4 0 1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3 2 2 0 1 1-2.8-2.8 1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1 2 2 0 0 1 0-4 1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8 2 2 0 1 1 2.8-2.8 1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5 2 2 0 0 1 4 0 1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3 2 2 0 1 1 2.8 2.8 1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1 2 2 0 0 1 0 4 1.6 1.6 0 0 0-1.5 1z"/></svg>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="flex:1;min-width:0;">
        <div class="eyebrow" style="margin-bottom:2px;">Welcome back</div>
        <div class="h-page">Wednesday, 26 February</div>
      </div>
      <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add a job</button>
    </div>

    <div style="flex:1;padding:28px;background:var(--bg);">
      <div style="max-width:1180px;height:100%;border:1px dashed var(--border-strong);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
        <div class="spec" style="font-size:12px;color:var(--text-2);">Content region</div>
        <div class="spec">240px rail · 56px topbar · 28px content padding · 1180px max-width</div>
        <div style="display:flex;gap:22px;margin-top:8px;">
          <div style="text-align:center;"><div style="width:64px;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 1px 2px oklch(0.2 0.02 262 / .06);"></div><div class="spec" style="font-size:10px;margin-top:6px;">card · sh-sm</div></div>
          <div style="text-align:center;"><div style="width:64px;height:40px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;"></div><div class="spec" style="font-size:10px;margin-top:6px;">inset · surface-2</div></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
