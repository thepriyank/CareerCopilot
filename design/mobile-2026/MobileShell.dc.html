<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
<style>
  :root {
    --accent: oklch(0.63 0.108 185);
    --accent-hover: oklch(0.57 0.110 185);
    --accent-fg: #ffffff;
    --accent-subtle: oklch(0.965 0.028 185);
    --accent-text: oklch(0.44 0.090 185);
    --paper: oklch(0.985 0.002 255);
    --paper-2: oklch(0.972 0.003 255);
    --paper-3: oklch(0.955 0.004 255);
    --surface: #ffffff;
    --line: oklch(0.918 0.004 255);
    --line-2: oklch(0.945 0.004 255);
    --text: oklch(0.24 0.012 262);
    --text-soft: oklch(0.44 0.012 262);
    --text-muted: oklch(0.58 0.010 262);
    --text-faint: oklch(0.72 0.008 262);
    --font-display: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --shadow-2: 0 1px 3px oklch(0.2 0.02 262 / 0.09), 0 1px 2px oklch(0.2 0.02 262 / 0.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper-2); }
  body { font-family: var(--font-sans); color: var(--text); }
  .frame {
    width: 390px; height: 844px;
    background: var(--paper);
    display: flex; flex-direction: column;
    overflow: hidden;
    font-size: 14px; line-height: 1.5; letter-spacing: -0.006em;
  }
  .topbar {
    height: 56px; flex-shrink: 0;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
  .title { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; font-size: 16px; margin-top: 1px; }
  .logo-dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 12px; }
  .content {
    flex: 1; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    background:
      repeating-linear-gradient(135deg, var(--line-2) 0 1px, transparent 1px 14px);
  }
  .content-note {
    background: var(--surface); border: 1px dashed var(--line);
    border-radius: 12px; padding: 20px 22px; max-width: 260px; text-align: center;
    box-shadow: var(--shadow-2);
  }
  .content-note .t { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .content-note .d { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
  .m-tabbar {
    height: 76px; flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-around;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    background: oklch(1 0 0 / 0.9);
  }
  .m-tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-muted);
    min-width: 44px; min-height: 44px;
  }
  .m-tab.active { color: var(--accent-text); }
  .annot {
    position: absolute; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    box-shadow: var(--shadow-2); max-width: 210px; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="topbar">
      <div>
        <div class="eyebrow">Welcome back</div>
        <div class="title">Thursday, September 10</div>
      </div>
      <div class="logo-dot"><i style="font-style:normal">J</i></div>
    </div>

    <div class="content">
      <div class="content-note">
        <div class="t">Sidebar → bottom tabs</div>
        <div class="d">Below 768px the fixed 240px sidebar is replaced by this bar. Each dashboard screen (Dashboard, Jobs, Job detail, Approvals, Roadmap, LinkedIn, Resume, Settings) renders full-width above it.</div>
      </div>
    </div>

    <div class="m-tabbar">
      <div class="m-tab active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="m-tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 12h18"/></svg>
        <span>Jobs</span>
      </div>
      <div class="m-tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
        <span>Roadmap</span>
      </div>
      <div class="m-tab">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.4 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.4 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.4-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.4-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.4H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.4l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.4 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
        <span>You</span>
      </div>
    </div>
  </div>
</body>
</html>
