<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>JobMagnate</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 280px; padding: 16px; margin: 0; color: #1a1a1a; }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .status { font-size: 12px; color: #666; margin-bottom: 12px; min-height: 16px; }
  button { width: 100%; padding: 8px 12px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; margin-bottom: 8px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .primary { background: #2f9e6f; color: white; }
  .secondary { background: #eee; color: #333; }
  .result { font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px; background: #f5f5f5; line-height: 1.4; }
  .divider { font-size: 11px; color: #999; text-align: center; margin: 10px 0; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 10px; font-size: 12px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 8px; font-family: monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>JobMagnate — Assisted Apply</h1>
  <div id="status" class="status">Checking…</div>
  <button id="connectBtn" class="primary" hidden>Connect to JobMagnate</button>

  <div id="manualConnect" hidden>
    <div class="divider">or paste a token from Settings → Extensions</div>
    <input id="tokenInput" type="text" placeholder="ext_…" autocomplete="off" />
    <button id="useTokenBtn" class="secondary">Use this token</button>
  </div>

  <button id="fillBtn" class="primary" hidden>Fill this form</button>
  <button id="disconnectBtn" class="secondary" hidden>Disconnect</button>
  <div id="result" class="result" hidden></div>
  <script src="popup.js"></script>
</body>
</html>
