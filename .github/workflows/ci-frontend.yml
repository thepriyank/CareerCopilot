name: CI · Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx next lint

      - name: Unit tests
        # No test files exist in frontend/ yet — --passWithNoTests keeps
        # this job green until real tests are added, rather than either
        # lying about coverage or hard-failing every PR on a suite that
        # was never built. Drop the flag once the first *.test.ts(x) lands.
        run: npx jest --passWithNoTests

      - name: Build
        run: npm run build
        env:
          # Placeholder values — this build only proves the app compiles;
          # nothing here is published. Real values are supplied as Docker
          # build-args in deploy-frontend.yml, from real secrets.
          NEXT_PUBLIC_API_URL: https://staging.example.invalid
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
